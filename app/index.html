<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sideline Rips</title>
<style>
  :root{
    --bg:#0a0d16; --bg2:#0f1422; --panel:#141a2b; --panel2:#1b2338;
    --text:#f2f4fb; --sub:#8993ad; --line:#2a3350;
    --gold:#ffd35c; --accent:#7c5cff;
    --c-common:#8a93a8; --c-uncommon:#3ddc84; --c-rare:#4da3ff; --c-epic:#c05cff; --c-legendary:#ffb020;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow-x:hidden;}
  body{background:
      radial-gradient(1200px 600px at 15% -10%, #1c2748 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, #2a1a3d 0%, transparent 55%),
      var(--bg);
    min-height:100vh;}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#2a3350;border-radius:8px;}

  /* ---------- Top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;position:sticky;top:0;z-index:50;
    background:rgba(10,13,22,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.3px;}
  .brand .mark{width:32px;height:32px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),#ff5c9a);
    display:flex;align-items:center;justify-content:center;font-size:17px;
    box-shadow:0 0 18px rgba(124,92,255,.55);}
  .nav{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:12px;border:1px solid var(--line);}
  .nav button{background:transparent;border:none;color:var(--sub);font-weight:700;font-size:13.5px;
    padding:9px 16px;border-radius:9px;cursor:pointer;transition:.15s;}
  .nav button.active{background:var(--accent);color:#fff;box-shadow:0 0 14px rgba(124,92,255,.45);}
  .nav button:not(.active):hover{color:var(--text);background:var(--panel2);}
  .wallet{display:flex;align-items:center;gap:10px;}
  .coins{display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,#241a08,#2c2007);
    border:1px solid #4a3a10;color:var(--gold);font-weight:800;padding:8px 14px;border-radius:999px;font-size:14px;}
  .coins .dot{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b8,var(--gold) 55%,#c98f10);
    box-shadow:0 0 8px rgba(255,211,92,.6);}
  .btn{cursor:pointer;border:none;border-radius:10px;font-weight:800;font-size:13px;padding:9px 14px;
    background:var(--panel2);color:var(--text);border:1px solid var(--line);transition:.15s;}
  .btn:hover{border-color:#3d4a72;transform:translateY(-1px);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#a06bff);color:#fff;border:none;box-shadow:0 4px 18px rgba(124,92,255,.4);}
  .btn.gold{background:linear-gradient(135deg,#ffcf4d,#ff9d3d);color:#231400;border:none;}

  h1.page-title{font-size:26px;margin:6px 0 4px;font-weight:800;}
  p.page-sub{color:var(--sub);margin:0 0 22px;font-size:14.5px;}

  /* ---------- Pack store ---------- */
  .pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;}
  .pack-card{position:relative;border-radius:18px;padding:20px 16px 18px;overflow:hidden;
    border:1px solid var(--line);cursor:pointer;transition:.25s;background:var(--panel);
    display:flex;flex-direction:column;align-items:center;text-align:center;}
  .pack-card:hover{transform:translateY(-6px);box-shadow:0 14px 34px rgba(0,0,0,.45);}
  .pack-card .glow{position:absolute;inset:-40%;opacity:.55;filter:blur(30px);z-index:0;}
  .pack-card>*{position:relative;z-index:1;}
  .pack-art{width:120px;height:150px;border-radius:12px;margin:6px 0 14px;position:relative;
    display:flex;align-items:center;justify-content:center;font-size:46px;
    box-shadow:0 10px 26px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.08);
    background-size:200% 200%;animation:packshine 5s ease infinite;}
  @keyframes packshine{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .pack-art::after{content:"";position:absolute;inset:0;border-radius:12px;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);
    background-size:250% 250%;animation:sheen 3.2s linear infinite;}
  @keyframes sheen{0%{background-position:200% 0}100%{background-position:-50% 0}}
  .pack-name{font-weight:800;font-size:16.5px;margin-bottom:2px;}
  .pack-desc{color:var(--sub);font-size:12.5px;margin-bottom:14px;min-height:32px;}
  .pack-buy{width:100%;padding:10px;border-radius:10px;font-weight:800;font-size:13.5px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--gold),#ff9d3d);color:#241500;}
  .pack-buy:disabled{background:#2a3350;color:#6c7692;cursor:not-allowed;}
  .odds{margin-top:10px;font-size:10.5px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .odds span{padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);}

  /* theme glows */
  .t-pokemon .glow{background:radial-gradient(circle,#ffcc33,#e0304f 70%);}
  .t-pokemon .pack-art{background-image:linear-gradient(135deg,#ffcf3f,#ff5b5b,#3b6bff);}
  .t-yugioh .glow{background:radial-gradient(circle,#caa1ff,#3d1a66 70%);}
  .t-yugioh .pack-art{background-image:linear-gradient(135deg,#2b1146,#7b3fe4,#f2c94c);}
  .t-basketball .glow{background:radial-gradient(circle,#ff9a3d,#3a1400 70%);}
  .t-basketball .pack-art{background-image:linear-gradient(135deg,#ff8a1f,#e2401a,#1a1a1a);}
  .t-baseball .glow{background:radial-gradient(circle,#7fb2ff,#0a1c40 70%);}
  .t-baseball .pack-art{background-image:linear-gradient(135deg,#1c3f8c,#c8102e,#f4f4f4);}
  .t-football .glow{background:radial-gradient(circle,#7ee08a,#0c2b12 70%);}
  .t-football .pack-art{background-image:linear-gradient(135deg,#2f5d34,#5a3a22,#c8a04a);}

  /* ---------- Pack opening stage ---------- */
  .stage{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
  .stage-bg{position:absolute;inset:0;border-radius:24px;opacity:.35;filter:blur(60px);z-index:0;pointer-events:none;}
  .back-link{align-self:flex-start;margin-bottom:6px;}
  .rip-pack{width:220px;height:300px;border-radius:16px;position:relative;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:70px;
    background-size:200% 200%;animation:packshine 4s ease infinite, floaty 2.6s ease-in-out infinite;
    box-shadow:0 20px 50px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.1);z-index:1;}
  .rip-pack::after{content:"";position:absolute;inset:0;border-radius:16px;
    background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.4) 42%,transparent 58%);
    background-size:250% 250%;animation:sheen 2.4s linear infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
  .rip-pack.tearing{animation:tear .55s forwards;}
  @keyframes tear{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(0) rotate(20deg);opacity:0;}}
  .rip-hint{margin-top:22px;color:var(--sub);font-size:13.5px;font-weight:600;letter-spacing:.3px;}
  .rip-title{font-size:22px;font-weight:800;margin-bottom:2px;}

  .reveal-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-end;min-height:340px;}
  .card-slot{width:190px;height:266px;perspective:1200px;}
  .card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.2,.9,.25,1.05);cursor:pointer;}
  .card-slot.flipped .card-inner{transform:rotateY(180deg);}
  .card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.5);}
  .card-back{background:linear-gradient(135deg,#1b2338,#0a0d16);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .card-back .logo{width:64px;height:64px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#ff5c9a);opacity:.85;
    display:flex;align-items:center;justify-content:center;font-size:28px;}
  .card-front{transform:rotateY(180deg);display:flex;flex-direction:column;background:var(--panel);
    border:2px solid var(--line);}
  .card-front.r-common{border-color:var(--c-common);}
  .card-front.r-uncommon{border-color:var(--c-uncommon);box-shadow:0 0 18px rgba(61,220,132,.35);}
  .card-front.r-rare{border-color:var(--c-rare);box-shadow:0 0 20px rgba(77,163,255,.45);}
  .card-front.r-epic{border-color:var(--c-epic);box-shadow:0 0 24px rgba(192,92,255,.55);}
  .card-front.r-legendary{border-color:var(--c-legendary);box-shadow:0 0 30px rgba(255,176,32,.6);}
  .card-photo{position:relative;flex:1;background:#0b0e17;overflow:hidden;}
  .card-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:40px;background:linear-gradient(135deg,#1b2338,#0a0d16);color:rgba(255,255,255,.28);}
  .card-info{padding:8px 10px 10px;background:linear-gradient(180deg,#171e30,#11172a);}
  .card-info .nm{font-weight:800;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-info .sub{font-size:10.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rarity-tag{position:absolute;top:8px;left:8px;font-size:9.5px;font-weight:800;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;letter-spacing:.4px;z-index:2;color:#0a0d16;}
  .rarity-tag.r-common{background:var(--c-common);}
  .rarity-tag.r-uncommon{background:var(--c-uncommon);}
  .rarity-tag.r-rare{background:var(--c-rare);color:#fff;}
  .rarity-tag.r-epic{background:var(--c-epic);color:#fff;}
  .rarity-tag.r-legendary{background:linear-gradient(90deg,#ffe08a,#ffb020);}
  .dupe-tag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;
    font-weight:800;padding:3px 7px;border-radius:999px;z-index:2;}
  .holo-sweep{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;}
  .card-front.r-epic .holo-sweep, .card-front.r-legendary .holo-sweep{
    opacity:1;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.55) 32%,rgba(255,180,255,.5) 40%,transparent 55%);
    background-size:250% 250%;animation:sheen 1.8s linear infinite;}
  .new-badge{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,#ffe08a,#ffb020);color:#241500;
    font-size:9.5px;font-weight:900;text-align:center;padding:3px 8px;border-radius:999px;letter-spacing:.4px;
    box-shadow:0 2px 10px rgba(255,176,32,.55);opacity:0;transform:scale(.5);
    animation:popin .3s .45s cubic-bezier(.3,1.6,.4,1) forwards;z-index:2;}
  @keyframes popin{to{opacity:1;transform:scale(1);}}

  .burst{position:fixed;inset:0;pointer-events:none;z-index:80;}
  .burst i{position:absolute;display:block;border-radius:2px;}

  .stage-actions{display:flex;gap:12px;margin-top:28px;}

  /* ---------- Collection ---------- */
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .chip{padding:8px 15px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
    font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;}
  .chip.active{background:var(--accent);color:#fff;border-color:transparent;}
  .stat-row{display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .stat-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:120px;}
  .stat-box .v{font-size:20px;font-weight:800;}
  .stat-box .l{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
  .bind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
  .bind-cell{aspect-ratio:5/7;border-radius:12px;border:2px solid var(--line);position:relative;overflow:hidden;
    background:var(--panel);cursor:pointer;transition:.15s;}
  .bind-cell:hover{transform:translateY(-3px);}
  .bind-cell.owned.r-common{border-color:var(--c-common);}
  .bind-cell.owned.r-uncommon{border-color:var(--c-uncommon);}
  .bind-cell.owned.r-rare{border-color:var(--c-rare);}
  .bind-cell.owned.r-epic{border-color:var(--c-epic);}
  .bind-cell.owned.r-legendary{border-color:var(--c-legendary);}
  .bind-cell img{width:100%;height:100%;object-fit:cover;display:block;}
  .bind-cell.locked{display:flex;align-items:center;justify-content:center;color:#3a4364;font-size:26px;}
  .bind-cell .lbl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);
    padding:14px 6px 5px;font-size:10.5px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bind-cell .cnt{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);font-size:10px;font-weight:800;
    padding:2px 6px;border-radius:999px;}
  .empty-note{color:var(--sub);font-size:14px;text-align:center;padding:50px 0;}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(4,6,12,.75);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:90;}
  .modal-card{width:270px;}
  .modal-close{position:fixed;top:22px;right:26px;font-size:26px;color:#fff;cursor:pointer;z-index:91;opacity:.8;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--line);padding:11px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:95;
    box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .25s,transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  @media(max-width:520px){
    .topbar{padding:10px 12px;flex-wrap:wrap;gap:8px;}
    .brand{font-size:16px;}
    .nav button{padding:7px 10px;font-size:12px;}
    .card-slot{width:150px;height:210px;}
    .rip-pack{width:170px;height:230px;font-size:52px;}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="mark">🏆</div>Sideline Rips</div>
  <div class="nav">
    <button id="nav-packs" class="active" onclick="goto('packs')">Packs</button>
    <button id="nav-collection" onclick="goto('collection')">Collection</button>
  </div>
  <div class="wallet">
    <div class="coins"><span class="dot"></span><span id="coin-count">0</span></div>
    <button class="btn gold" onclick="addCoins(500)">+ Get Coins</button>
  </div>
</div>

<div class="wrap" id="view-root"></div>

<div id="toast" class="toast"></div>

<script>
/* ======================= DATA ======================= */
var CARD_DATA = /*__CARD_DATA__*/ [] /*__END_CARD_DATA__*/;

// Fallback sample so the page is never empty if data injection failed.
if(!CARD_DATA || !CARD_DATA.length){
  CARD_DATA = [
    {category:"pokemon",id:"p1",name:"Charizard",subtitle:"Base Set · Fire",image:"https://images.pokemontcg.io/base1/4_hires.png",rarity:"legendary",meta:"HP 120 · Fire"},
    {category:"pokemon",id:"p2",name:"Caterpie",subtitle:"Base Set · Grass",image:"https://images.pokemontcg.io/base1/45_hires.png",rarity:"common",meta:"HP 40 · Grass"},
    {category:"yugioh",id:"y1",name:"Blue-Eyes White Dragon",subtitle:"Legend of Blue Eyes",image:"https://images.ygoprodeck.com/images/cards/89631139.jpg",rarity:"legendary",meta:"ATK 3000 / DEF 2500"},
    {category:"basketball",id:"b1",name:"Sample Player",subtitle:"PG · Sample Team",image:"",rarity:"rare",meta:"24.1 PPG"},
    {category:"baseball",id:"ba1",name:"Sample Player",subtitle:"OF · Sample Team",image:"",rarity:"uncommon",meta:".301 AVG"},
    {category:"football",id:"f1",name:"Sample Player",subtitle:"QB · Sample Team",image:"",rarity:"epic",meta:"4200 YDS"}
  ];
}

var CATEGORIES = [
  {key:"pokemon",    label:"Pokémon TCG",   icon:"⚡", price:150, desc:"Catch iconic monsters from the original sets.", theme:"t-pokemon"},
  {key:"yugioh",     label:"Yu-Gi-Oh!",     icon:"🐉", price:150, desc:"Classic duel monsters & legendary dragons.",   theme:"t-yugioh"},
  {key:"basketball", label:"Basketball",    icon:"🏀", price:175, desc:"NBA stars, fresh off the hardwood.",           theme:"t-basketball"},
  {key:"baseball",   label:"Baseball",      icon:"⚾", price:150, desc:"MLB rookies, aces & franchise cornerstones.",  theme:"t-baseball"},
  {key:"football",   label:"Football",      icon:"🏈", price:175, desc:"NFL playmakers ready to hit your binder.",     theme:"t-football"}
];

function mediaHTML(card){
  var icon = (CATEGORIES.filter(function(c){return c.key===card.category;})[0]||{}).icon || "🃏";
  if(!card.image){
    return '<div class="img-fallback">'+icon+'</div>';
  }
  return '<img src="'+card.image+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' +
         '<div class="img-fallback" style="display:none">'+icon+'</div>';
}

var RARITIES = ["common","uncommon","rare","epic","legendary"];
var RARITY_LABEL = {common:"Common",uncommon:"Uncommon",rare:"Rare",epic:"Epic",legendary:"Legendary"};
// odds per non-guaranteed slot
var SLOT_WEIGHTS = [
  {common:70,uncommon:22,rare:6,epic:1.6,legendary:0.4},
  {common:70,uncommon:22,rare:6,epic:1.6,legendary:0.4},
  {common:55,uncommon:30,rare:11,epic:3,legendary:1},
  {common:30,uncommon:35,rare:24,epic:8,legendary:3},
  {common:0,uncommon:20,rare:45,epic:26,legendary:9} // hit slot, guaranteed uncommon+
];

/* ======================= STATE ======================= */
var STATE = {coins:900, collection:{}, view:"packs", collFilter:"all", packsOpened:0};
try{
  var saved = localStorage.getItem("sideline-rips-state");
  if(saved) STATE = JSON.parse(saved);
}catch(e){}

function save(){ try{ localStorage.setItem("sideline-rips-state", JSON.stringify(STATE)); }catch(e){} }
function poolFor(cat){ return CARD_DATA.filter(function(c){return c.category===cat;}); }
function byRarity(pool, r){ return pool.filter(function(c){return c.rarity===r;}); }

function weightedRarity(weights){
  var total=0, k;
  for(k in weights) total+=weights[k];
  var roll = Math.random()*total, acc=0;
  for(k in weights){ acc+=weights[k]; if(roll<=acc) return k; }
  return "common";
}

function pickCard(cat, rarity){
  var pool = poolFor(cat);
  var opts = byRarity(pool, rarity);
  if(!opts.length){
    // fall back to nearest available rarity
    var idx = RARITIES.indexOf(rarity);
    for(var d=1; d<RARITIES.length; d++){
      var down = byRarity(pool, RARITIES[Math.max(0,idx-d)]);
      var up = byRarity(pool, RARITIES[Math.min(RARITIES.length-1,idx+d)]);
      if(down.length){ opts=down; break; }
      if(up.length){ opts=up; break; }
    }
  }
  if(!opts.length) opts = pool;
  return opts[Math.floor(Math.random()*opts.length)];
}

function generatePack(cat){
  return SLOT_WEIGHTS.map(function(w){ return pickCard(cat, weightedRarity(w)); });
}

function addToCollection(card){
  var wasNew = !STATE.collection[card.id];
  STATE.collection[card.id] = (STATE.collection[card.id]||0)+1;
  return wasNew;
}

function addCoins(n){ STATE.coins += n; save(); renderTop(); toast("+"+n+" coins added"); }

/* ======================= RENDER: SHELL ======================= */
function renderTop(){ document.getElementById("coin-count").textContent = STATE.coins.toLocaleString(); }

function goto(view){
  STATE.view = view;
  document.getElementById("nav-packs").classList.toggle("active", view==="packs");
  document.getElementById("nav-collection").classList.toggle("active", view==="collection");
  render();
}

function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

function render(){
  renderTop();
  var root = document.getElementById("view-root");
  if(STATE.view==="packs") root.innerHTML = packsHTML();
  else if(STATE.view==="collection") root.innerHTML = collectionHTML();
  else root.innerHTML = "";
}

/* ======================= RENDER: PACK STORE ======================= */
function packsHTML(){
  var cards = CATEGORIES.map(function(c){
    var pool = poolFor(c.key);
    var counts = RARITIES.map(function(r){return byRarity(pool,r).length;});
    var affordable = STATE.coins>=c.price;
    return (
      '<div class="pack-card '+c.theme+'" onclick="openStage(\''+c.key+'\')">' +
        '<div class="glow"></div>' +
        '<div class="pack-art">'+c.icon+'</div>' +
        '<div class="pack-name">'+c.label+'</div>' +
        '<div class="pack-desc">'+c.desc+'</div>' +
        '<button class="pack-buy" '+(affordable?'':'disabled')+'>'+
          (affordable? ('Rip Pack · '+c.price+' 🪙') : 'Need '+c.price+' coins') +
        '</button>' +
        '<div class="odds">'+
          '<span>'+pool.length+' cards in set</span>'+
        '</div>'+
      '</div>'
    );
  }).join("");

  return (
    '<h1 class="page-title">Pack Store</h1>' +
    '<p class="page-sub">Pick a category and rip a fresh pack. Rares shine, legendaries glow.</p>' +
    '<div class="pack-grid">'+cards+'</div>'
  );
}

/* click handler needs pack price lookup guarded against insufficient funds */
function openStage(catKey){
  var cat = CATEGORIES.filter(function(c){return c.key===catKey;})[0];
  if(STATE.coins < cat.price){ toast("Not enough coins for that pack"); return; }
  var root = document.getElementById("view-root");
  root.innerHTML = stageHTML(cat);
}

function stageHTML(cat){
  return (
    '<div class="back-link"><button class="btn" onclick="render()">&larr; Back to Packs</button></div>' +
    '<div class="stage">' +
      '<div class="stage-bg" style="background:'+glowFor(cat.key)+'"></div>' +
      '<div class="rip-title">'+cat.label+' Pack</div>' +
      '<div class="rip-pack '+cat.theme+'" id="rip-pack" onclick="ripPack(\''+cat.key+'\')">'+cat.icon+'</div>' +
      '<div class="rip-hint">Tap the pack to rip it open</div>' +
    '</div>'
  );
}
function glowFor(key){
  var map={pokemon:"radial-gradient(circle,#ffcc33,transparent 70%)",yugioh:"radial-gradient(circle,#caa1ff,transparent 70%)",
    basketball:"radial-gradient(circle,#ff9a3d,transparent 70%)",baseball:"radial-gradient(circle,#7fb2ff,transparent 70%)",
    football:"radial-gradient(circle,#7ee08a,transparent 70%)"};
  return map[key]||map.pokemon;
}

/* ======================= RIP FLOW ======================= */
function ripPack(catKey){
  var cat = CATEGORIES.filter(function(c){return c.key===catKey;})[0];
  if(STATE.coins < cat.price){ toast("Not enough coins"); return; }
  var packEl = document.getElementById("rip-pack");
  packEl.onclick = null;
  packEl.classList.add("tearing");

  STATE.coins -= cat.price;
  STATE.packsOpened++;
  var pulled = generatePack(catKey);
  save();
  renderTop();

  setTimeout(function(){ showReveal(cat, pulled); }, 480);
}

function showReveal(cat, pulled){
  var root = document.getElementById("view-root");
  var slots = pulled.map(function(card, i){
    return (
      '<div class="card-slot" id="slot-'+i+'" onclick="flipSlot('+i+')">' +
        '<div class="card-inner">' +
          '<div class="card-face card-back"><div class="logo">🏆</div></div>' +
          '<div class="card-face card-front r-'+card.rarity+'">' +
            '<span class="rarity-tag r-'+card.rarity+'">'+RARITY_LABEL[card.rarity]+'</span>'+
            '<div class="card-photo">'+mediaHTML(card)+'<div class="holo-sweep"></div></div>'+
            '<div class="card-info"><div class="nm">'+card.name+'</div><div class="sub">'+card.subtitle+'</div></div>'+
          '</div>' +
        '</div>' +
      '</div>'
    );
  }).join("");

  root.innerHTML = (
    '<div class="back-link"><button class="btn" onclick="render()">&larr; Back to Packs</button></div>' +
    '<div class="stage">' +
      '<div class="rip-title">Your Pull</div>' +
      '<p class="page-sub">Tap each card to flip it over</p>' +
      '<div class="reveal-row">'+slots+'</div>' +
      '<div class="stage-actions" id="stage-actions" style="display:none">' +
        '<button class="btn primary" onclick="openStage(CAT_KEY_CURRENT)">Rip Another</button>' +
        '<button class="btn" onclick="goto(\'collection\')">View Collection</button>' +
      '</div>' +
    '</div>'
  );
  window.CAT_KEY_CURRENT = cat.key;
  window.CURRENT_PULL = pulled;
  window.FLIPPED_COUNT = 0;

  // auto-reveal sequentially with a slight cascade, still clickable to flip early
  pulled.forEach(function(card, i){
    setTimeout(function(){ flipSlot(i, card); }, 550 + i*550);
  });
}

function flipSlot(i, cardArg){
  var slot = document.getElementById("slot-"+i);
  if(!slot || slot.classList.contains("flipped")) return;
  var card = cardArg || window.CURRENT_PULL[i];
  slot.classList.add("flipped");

  var isNew = addToCollection(card);
  save(); renderTop();

  if(card.rarity==="epic" || card.rarity==="legendary"){
    burstAt(slot, card.rarity==="legendary" ? "#ffb020" : "#c05cff");
  }
  if(isNew){
    setTimeout(function(){
      var front = slot.querySelector(".card-front");
      var badge = document.createElement("div");
      badge.className="new-badge"; badge.textContent="NEW";
      front.appendChild(badge);
    }, 380);
  }

  window.FLIPPED_COUNT = (window.FLIPPED_COUNT||0) + 1;
  if(window.FLIPPED_COUNT === window.CURRENT_PULL.length){
    setTimeout(function(){
      var a = document.getElementById("stage-actions");
      if(a) a.style.display="flex";
    }, 500);
  }
}

function burstAt(el, color){
  var rect = el.getBoundingClientRect();
  var cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
  var wrap = document.createElement("div");
  wrap.className="burst";
  var n = 26;
  for(var i=0;i<n;i++){
    var p = document.createElement("i");
    var ang = (Math.PI*2*i)/n + Math.random()*0.4;
    var dist = 90+Math.random()*90;
    var dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist;
    var size = 4+Math.random()*5;
    p.style.left = cx+"px"; p.style.top = cy+"px";
    p.style.width = size+"px"; p.style.height = size+"px";
    p.style.background = color;
    p.style.boxShadow = "0 0 8px "+color;
    p.style.transition = "transform .8s cubic-bezier(.2,.8,.3,1), opacity .8s";
    wrap.appendChild(p);
    (function(p,dx,dy){
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          p.style.transform = "translate("+dx+"px,"+dy+"px) rotate("+(Math.random()*360)+"deg)";
          p.style.opacity = "0";
        });
      });
    })(p,dx,dy);
  }
  document.body.appendChild(wrap);
  setTimeout(function(){ wrap.remove(); }, 900);
}

/* ======================= COLLECTION ======================= */
function collectionHTML(){
  var owned = Object.keys(STATE.collection).length;
  var total = CARD_DATA.length;
  var pct = total? Math.round((owned/total)*100) : 0;
  var dupes = 0;
  Object.keys(STATE.collection).forEach(function(k){ dupes += (STATE.collection[k]-1); });

  var chips = ['<div class="chip '+(STATE.collFilter==="all"?"active":"")+'" onclick="setFilter(\'all\')">All</div>']
    .concat(CATEGORIES.map(function(c){
      return '<div class="chip '+(STATE.collFilter===c.key?"active":"")+'" onclick="setFilter(\''+c.key+'\')">'+c.icon+' '+c.label+'</div>';
    })).join("");

  var pool = STATE.collFilter==="all" ? CARD_DATA : poolFor(STATE.collFilter);
  var cells = pool.map(function(card){
    var count = STATE.collection[card.id]||0;
    if(!count){
      return '<div class="bind-cell locked">🔒</div>';
    }
    return (
      '<div class="bind-cell owned r-'+card.rarity+'" onclick="showModal(\''+card.id+'\')">' +
        mediaHTML(card) +
        (count>1? '<div class="cnt">x'+count+'</div>':'') +
        '<div class="lbl">'+card.name+'</div>' +
      '</div>'
    );
  }).join("");

  return (
    '<h1 class="page-title">Collection</h1>' +
    '<p class="page-sub">Everything you\'ve pulled lives here.</p>' +
    '<div class="stat-row">' +
      '<div class="stat-box"><div class="v">'+owned+' / '+total+'</div><div class="l">Unique Cards</div></div>' +
      '<div class="stat-box"><div class="v">'+pct+'%</div><div class="l">Set Complete</div></div>' +
      '<div class="stat-box"><div class="v">'+dupes+'</div><div class="l">Duplicates</div></div>' +
      '<div class="stat-box"><div class="v">'+STATE.packsOpened+'</div><div class="l">Packs Opened</div></div>' +
    '</div>' +
    '<div class="filter-row">'+chips+'</div>' +
    (pool.length? '<div class="bind-grid">'+cells+'</div>' : '<div class="empty-note">No cards in this set yet.</div>')
  );
}

function setFilter(key){ STATE.collFilter = key; render(); }

function showModal(id){
  var card = CARD_DATA.filter(function(c){return c.id===id;})[0];
  if(!card) return;
  var bg = document.createElement("div");
  bg.className="modal-bg";
  bg.onclick = function(e){ if(e.target===bg) closeModal(); };
  bg.innerHTML = (
    '<span class="modal-close" onclick="closeModal()">&times;</span>' +
    '<div class="card-slot modal-card flipped">' +
      '<div class="card-inner">' +
        '<div class="card-face card-front r-'+card.rarity+'">' +
          '<span class="rarity-tag r-'+card.rarity+'">'+RARITY_LABEL[card.rarity]+'</span>'+
          '<div class="dupe-tag">x'+(STATE.collection[card.id]||1)+'</div>'+
          '<div class="card-photo">'+mediaHTML(card)+'<div class="holo-sweep"></div></div>'+
          '<div class="card-info"><div class="nm">'+card.name+'</div><div class="sub">'+card.subtitle+'</div><div class="sub">'+(card.meta||"")+'</div></div>'+
        '</div>' +
      '</div>' +
    '</div>'
  );
  bg.id="modal-bg";
  document.body.appendChild(bg);
}
function closeModal(){ var m=document.getElementById("modal-bg"); if(m) m.remove(); }

/* ======================= INIT ======================= */
render();
</script>
</body>
</html>
