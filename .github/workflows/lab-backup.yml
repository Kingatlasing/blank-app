# Copies Slab Scout's test data from the Streamlit server into the repo every 30 minutes, so nothing is lost when
# the app sleeps or restarts. Also wakes the app if it's asleep and restarts an interrupted grading test where it
# left off. Everything lands on the slab-scout-work branch under lab-data/.
#
# GitHub's own schedule proved unreliable for this repo, so each run keeps going for ~5.5 hours (a backup every
# 30 minutes) and then starts the next run itself. The schedule below is only a backstop in case the chain stops.
name: lab-backup
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: lab-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slab-scout-work
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _main
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -q playwright==1.48.0 requests
          python -m playwright install --with-deps chromium > /dev/null
      - name: Back up every 30 minutes
        run: |
          git config user.name "slab-scout-backup"
          git config user.email "slab-scout-backup@users.noreply.github.com"
          for round in $(seq 1 11); do
            echo "== round $round $(date -u +%H:%M)"
            python _main/.github/scripts/wake_app.py || true
            python _main/.github/scripts/lab_backup.py || true
            git add lab-data
            if ! git diff --cached --quiet; then
              git commit -q -m "lab-data backup $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do git pull -q --rebase origin slab-scout-work && git push -q origin HEAD:slab-scout-work && break; sleep 5; done
            fi
            [ "$round" -lt 11 ] && sleep 1800
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lab-backup.yml --ref main -R ${{ github.repository }}
